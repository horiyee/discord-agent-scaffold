[project]
name = "bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "horiyee", email = "horiyee.ka@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk==0.2.99",
    "discord-py==2.7.1",
    "openai==2.43.0",
]

[project.scripts]
bot = "bot:main"

[build-system]
requires = ["uv_build>=0.10.5,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["bot", "mcp_servers"]
